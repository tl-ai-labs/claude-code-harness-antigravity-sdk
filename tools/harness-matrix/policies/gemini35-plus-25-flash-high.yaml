# gemini35-plus-25-flash-high — the TIERED column of the cc×agSDK SDLC card:
# premium worker on judgment, cost-efficient worker on volume.
#
# ---------------------------------------------------------------------------
# STATUS 2026-07-31: HISTORICAL COLUMN — NOT A CURRENT PIN
# ---------------------------------------------------------------------------
# The Google-facing live runs pin `gemini-3.5-flash-lite` and route through
# `opus48-plus-lite.yaml`. Deletion of this column was proposed and rejected on
# 2026-07-31 — the full reasoning is in the sibling STATUS block in
# all-gemini-25-flash-high.yaml and is not repeated here.
#
# WHAT THIS COLUMN ACTUALLY RAN WITH — the whole reason it is kept unedited.
# Every value below is the value its recorded pass used, not a value chosen for
# today, and the entries further down this file still hold exactly these:
#
#   driver          claude-opus-4-6, --effort high   (builtin-anthropic → anthropic)
#   premium worker  gemini-3.5-flash, thinking HIGH  (antigravity-sdk → vertex, asia-south1)
#   volume worker   gemini-2.5-flash, thinking NONE  (antigravity-sdk → vertex, asia-south1)
#   evidence        examples/kudos-wall/passes/reference/ — 12 hand-offs + SDK receipts
#
# The driver line is the one most likely to look stale to a reader who arrives
# from the current policies: they were all re-pinned to claude-opus-4-8 on
# 2026-07-31 and this file was deliberately not, because its exemplar pass ran
# on 4.6. See the note at the driver leaf below.
#
# One thing this file specifically is worth keeping for: it is the ONLY tiered
# column whose two tiers are both WORKERS. `opus48-plus-lite.yaml` tiers across
# the driver/worker boundary — premium stages take the driver seat alone, cheap
# stages delegate. This one keeps every stage delegated and swaps the worker
# underneath, so the driver is held constant by construction. Those two
# arrangements answer different questions, and the newer file does not
# supersede this one.
#
# WHY THIS POLICY EXISTS (2026-07-26). all-gemini-flash-high and
# all-gemini-25-flash-high are the two CLEAN columns — one generation each,
# every stage. They answer "does a generation of model progress show up in an
# agentic SDLC harness". They do not answer the question the tokenomics track
# actually cares about: "which stages is the premium model worth paying for?"
# That needs a column where the generations are MIXED per stage, which is what
# this file is.
#
# WHERE THE TIER SPLIT COMES FROM — it is NOT invented here. It is lifted from
# the cost-optimised policy of a production SDLC orchestrator that has been
# running this split across many passes, whose thesis is that the premium tier
# buys JUDGMENT, not typing:
#
#   requirements_analysis  → opus    "Judgment-heavy, low volume — premium"
#   architecture_design    → opus    "Foundational, decision-bearing — premium"
#   plan_task_packets      → opus    "Needs full context to slice work cleanly"
#   senior_code_review     → opus    "Cross-file reasoning + judgment — premium"
#   security_review        → opus    "Risk-bearing, low volume — premium"
#   codegen / tests / docs → flash   "Schema-driven boilerplate — cost-efficient"
#   debug (retry_count≥2)  → opus    "Escalation: 2 cost-efficient attempts failed"
#   default                → opus    "Unrecognized task — fail safe to premium"
#
# This file maps that same split onto the harness's SDLC stage ids, with
# opus→gemini-3.5-flash (premium) and gemini-flash→gemini-2.5-flash
# (cost-efficient). Reusing a split that was already in production rather than
# authoring a new one is the whole point: this leg and that one then disagree
# about the MODELS and about nothing else, so a delta between them is
# attributable to the models rather than to two people's taste in stage tiers.
#
#   orchestrator phase       harness stage    tier
#   ─────────────────────────────────────────────────────────
#   requirements_analysis    requirements     premium  (3.5)
#   architecture_design      design           premium  (3.5)
#   plan_task_packets        plan-packets     premium  (3.5)
#   codegen + tests + docs   execute          cheap    (2.5)
#   debug                    verify repairs   cheap    (2.5) — see below
#   senior_code_review       review           premium  (3.5)
#   security_review          (no analog)      —        sdlc-mini has no security
#                                                      stage; see the note above
#                                                      `rules:`
#   (default rule)           judge            premium  (3.5)
#
# VERIFY REPAIRS INHERIT THE EXECUTE BINDING. The harness bills a verify
# stage's repair rounds under the EXECUTE stage's binding, so pinning execute
# to 2.5 automatically puts repairs on 2.5 — which is exactly what the source
# rule `debug → cost-efficient tier "Most debugs have clear cause"` asks for. No
# extra rule is needed, and adding one would let the two drift apart.
#
# ---------------------------------------------------------------------------
# MIGRATED TO THE UNIFIED SCHEMA — version 2 (2026-07-29)
# ---------------------------------------------------------------------------
# Full rationale lives in all-opus.yaml. This file gains the most from it: the
# per-stage tier split it inherits used to be recorded only as the
# hand-maintained table above, and is now expressed in the same schema the
# bindings are, so the split a run actually used is frozen into that run's
# policy_snapshot.yaml rather than living in a comment. Both cell ids
# (`flash-35-high`, `flash-25-high`) are UNCHANGED, because they are the
# `modelId` recorded runs already carry.
#
# ONE GAP THIS MIGRATION CLOSES, AND ONE IT DOES NOT:
#
# CLOSED — the tier split is now expressed with the source orchestrator's own
# matcher, so the two legs share one routing vocabulary rather than two.
#
# SECURITY_REVIEW STAYS UNSTATED, deliberately. The source split routes it to
# the premium tier, and the migration briefly carried a rule saying so. The rule
# was removed on 2026-07-31 because templates/sdlc-mini/template.yaml defines no
# such stage: the rule could never match, so it advertised a routing decision
# that no run would ever exercise — a comment pretending to be behaviour. If a
# template ever emits a security stage, the `default` rule already sends it to
# premium, which is the tier the source split asks for; state it explicitly then,
# once there is a stage for it to bind to.
#
# NOT CLOSED — the escalation rule (`debug, retry_count: {gte: 2} → opus`). The
# SCHEMA can express it now; `retry_count` is a first-class matcher key and the
# rule would validate. The RESOLVER cannot yet honour it: the harness resolves
# every stage exactly once, before the run, at `retry_count: 0`
# (policy-core.mjs → resolveHarnessStages), and each retry re-uses that one
# resolved binding. Writing the rule today would produce a file that reads as
# though it escalates and never does — strictly worse than not having it. Wiring
# it means resolving per ATTEMPT rather than per stage, which is a real change
# to the harness's execution loop and is deliberately NOT smuggled in here.
# Recorded so nobody reads this column as already testing escalation: it does
# not. Whoever builds it should know escalation is not a new idea needing a
# design — the source orchestrator has shipped this exact rule across many
# passes, and the table above is the precedent to port.
#
# HELD CONSTANT vs both clean columns: driver pin, driver effort, region, retry
# policy, limits — AS ALL THREE FILES STOOD IN JULY 2026, which is when all
# three ran. It was true on the day and it is what makes the recorded passes
# comparable. It is no longer true of the files on disk: all-gemini-flash-high
# was re-pinned to gemini-3.5-flash-lite @ global and its driver, along with
# all-opus's, moved to claude-opus-4-8 on 2026-07-31. Compare this column
# against those RECORDED PASSES, not against a fresh run of the current files.
#
# NOT held constant — worker thinking level, and NOT by choice (2026-07-26).
# The premium tier runs gemini-3.5-flash at thinking HIGH; the cost-efficient
# tier runs gemini-2.5-flash at NONE, because Vertex hard-rejects
# thinking_level on 2.5 Flash (the 400 is quoted verbatim at that tier's worker
# leaf below). So the execute stage differs from its 3.5 siblings in two
# variables, not one. Whoever reads a delta on this column must attribute it to
# "generation + thinking, jointly" — the platform gives no way to separate them
# for this model, and pretending otherwise would be the dishonest read.
version: 2
name: gemini35-plus-25-flash-high
models:
  # ---- the two cells ------------------------------------------------------
  # Both are delegated Opus→Gemini cells on claude-code and they share a driver
  # leaf; ONLY the worker differs. That shared `driver: opus-anthropic` is the
  # structural version of what used to be a promise in a comment ("SAME driver —
  # only the worker tiers"): there is now literally one driver entry, so the two
  # tiers cannot drift apart by editing one of them.
  - id: flash-35-high                 # UNCHANGED id — premium tier
    composition: delegated
    runtime: claude-code
    driver: opus-anthropic
    worker: flash-35-agsdk-vertex
  - id: flash-25-high                 # UNCHANGED id — cost-efficient tier
    composition: delegated
    runtime: claude-code
    driver: opus-anthropic
    worker: flash-25-agsdk-vertex

  # ---- driver leaf, shared by both tiers ----------------------------------
  - id: opus-anthropic
    adapter: builtin-anthropic        # HELD CONSTANT with every sibling policy
    api: anthropic
    # DELIBERATELY LEFT ON 4.6 (2026-07-31). On that date the three current
    # cells — all-opus, all-gemini-flash-high, opus48-plus-lite — were re-pinned
    # together to claude-opus-4-8 so they would share one driver generation.
    # This file was NOT moved with them, and that is the point: it is a
    # historical column whose exemplar pass under
    # examples/kudos-wall/passes/reference/ ran on a 4.6 driver. Re-pinning it
    # would make the policy describe a run that never happened. What it now
    # costs is the sibling comparison — this column and the current ones no
    # longer share a driver, so a delta against them carries a driver change
    # too. That was already true of the worker axis and is recorded in the
    # STATUS block at the top of this file.
    model_name: claude-opus-4-6       # what this column RAN WITH — not a current pin
    reasoning:
      effort: high                    # driver effort pin (--effort high)
    # No `pricing:` — composition member, priced from real receipts (all-opus.yaml).

  # ---- premium tier worker: judgment-heavy, low-volume stages -------------
  - id: flash-35-agsdk-vertex
    adapter: antigravity-sdk
    api: vertex
    model_name: gemini-3.5-flash      # premium tier (orchestrator's `opus` slot)
    region: asia-south1
    reasoning:
      tier: high                      # was `worker_thinking: HIGH`

  # ---- cost-efficient tier worker: high-volume mechanical stages ----------
  - id: flash-25-agsdk-vertex
    adapter: antigravity-sdk          # same cable as the premium tier — only the model tiers
    api: vertex
    model_name: gemini-2.5-flash      # cost-efficient tier (orchestrator's `gemini-flash` slot)
    region: asia-south1
    # NO `reasoning:` BLOCK — DO NOT ADD ONE (2026-07-26, carried through the
    # 2026-07-29 migration). Under the legacy schema this was the absent
    # `worker_thinking` key; `reasoning.tier` is where that value now lives, so
    # omitting the block is how this tier keeps saying the same thing. The
    # resolver omits `worker_thinking` from the binding entirely when no tier is
    # declared, which audit.mjs reads as NONE.
    #
    # This tier carried `worker_thinking: HIGH` for parity with the 3.5 tier,
    # which reads sensibly and is impossible: Vertex rejects the parameter on
    # this model outright, verbatim —
    #
    #   AntigravityConnectionError: Agent execution terminated due to
    #   error. ("request failed (code 400): Unable to submit request
    #   because thinking_level is not supported by this model..")
    #
    # It cost a whole paid tiered run to learn. The 2026-07-26 kudos-wall run's
    # first execute delegation 400'd on exactly this; the driver then silently
    # dropped the flag and retried, so both execute delegations ran at NONE
    # while every header row still advertised HIGH — an unannounced change to
    # the experiment that every gate passed. The audit's
    # delegation-policy-mismatch family (audit.mjs) now catches that class of
    # drift, but the honest fix is to not ask for the impossible: declaring no
    # tier resolves to NONE, which is what this tier can actually run.
    #
    # CONSEQUENCE FOR THE COMPARISON, stated so nobody reads this column as a
    # clean single-variable A/B: execute differs from the 3.5 tier in BOTH model
    # generation and thinking level, because on Vertex today those two cannot be
    # varied independently for 2.5 Flash. That is a platform constraint to
    # report, not a defect to hide.
rules:
  # One rule per stage rather than one array entry covering several — the
  # per-stage `reason` is the record of WHY that stage sits in its tier, it is
  # frozen into every run's policy_snapshot.yaml, and it is the first thing
  # somebody auditing the cost split will read.
  #
  # EVERY `when.phase` BELOW IS A REAL STAGE ID from
  # templates/sdlc-mini/template.yaml. A rule naming a stage the template does
  # not define is not an error and not a warning — it simply never matches, so
  # it reads as an intentional tier assignment while doing nothing at all. One
  # such rule (`security_review`) was inherited from the source policy's phase
  # list and removed on 2026-07-31; the template's eight stages are
  # requirements, design, plan-packets, execute, verify, review, judge, report.
  - when: { phase: requirements }
    use: flash-35-high
    reason: requirements analysis — judgment-heavy, low volume → premium
  - when: { phase: design }
    use: flash-35-high
    reason: architecture design — foundational, decision-bearing → premium
  - when: { phase: plan-packets }
    use: flash-35-high
    reason: task-packet planning — needs full context to slice work cleanly → premium
  - when: { phase: execute }
    use: flash-25-high
    reason: codegen + tests + docs — schema-driven boilerplate → cost-efficient
  - when: { phase: review }
    use: flash-35-high
    reason: senior code review — cross-file reasoning + judgment → premium
  - when: { phase: judge }
    use: flash-35-high
    reason: adjudication is judgment — premium, matching the fail-safe default
  # SWE-bench Pro's phases are NOT tiered here. This split is a map of SDLC
  # stages and has no honest Pro analog (a bug fix is not "schema-driven
  # boilerplate"), so pointing --instance-dir at this file falls through to the
  # default below and runs premium throughout. A tiered Pro column should be
  # designed on its own evidence, not inherited by accident from an SDLC file.
  - default: flash-35-high
    # Quoted because the value contains a colon-space, which YAML would
    # otherwise read as a nested mapping key.
    reason: "fail-safe `default` — an unrecognised stage runs on the premium tier"
retry:
  type: flat
  max_attempts: 3
# LIMITS: byte-identical to all-gemini-flash-high.yaml, all-gemini-25-flash-high
# .yaml and all-opus.yaml. DESIGN §2.4 treats a limit as part of the STUDY
# DEFINITION, not a tuning knob — two columns compared under different ceilings
# are not comparable, and a budget stop mid-stage is indistinguishable in the
# manifest from a model that gave up.
limits:
  phase_timeout_min: 45
  cmd_timeout_min: 15
  phase_budget_usd: 8.00
