# Pass 1 baseline — every phase runs on Opus 4.7. No multi-model behavior.
# Used by /ai-sdlc-pass1 to produce the premium-ceiling baseline cost.
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: opus-only

models:
  - id: opus
    adapter: builtin-anthropic
    api: anthropic
    model_name: claude-opus-4-7
    pricing:
      input: 5.00          # USD per 1M tokens (GA Opus 4.x; corrected 2026-07-20, was 15.00)
      input_cached: 0.50   # ~90% off after first call (corrected 2026-07-20, was 1.50)
      output: 25.00        # corrected 2026-07-20, was 75.00
    auth:
      env: ANTHROPIC_API_KEY

rules:
  - default: opus
    reason: "Pass 1 baseline — single-model, premium tier"
