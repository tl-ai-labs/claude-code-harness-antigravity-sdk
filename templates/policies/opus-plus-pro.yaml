# Pass 2 — premium-judgment on Opus 4.7, cost-efficient mechanical work on Gemini 2.5 Pro.
# Pro is the mid-tier alternative: stronger than Flash on cross-file reasoning,
# cheaper than Opus by roughly an order of magnitude.
#
# 2026-07-20: two truthfulness fixes for the Pathfinder payload-logging runs:
#   1. display_name previously said gemini-3.1-pro while model_name called
#      gemini-2.5-pro — the dashboard was lying about which model ran. Both
#      now say gemini-2.5-pro; 2.5 Pro is exactly what Teja asked to run.
#   2. region: us-central1 added — gemini-2.5-pro 404s in our pinned
#      asia-south1 (Mumbai) region (verified 2026-07-16); it serves fine in
#      us-central1. Without this override the env pin would break every Pro call.
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: opus-plus-pro

models:
  - id: opus
    adapter: builtin-anthropic
    api: anthropic
    model_name: claude-opus-4-7
    pricing: { input: 5.00, input_cached: 0.50, output: 25.00 }   # GA Opus 4.x rate (corrected 2026-07-20; was the 3.x-era 15/75)
    auth: { env: ANTHROPIC_API_KEY }
  - id: gemini-pro
    adapter: mcp   # same Vertex adapter; only the model_name changes
    api: vertex
    model_name: gemini-2.5-pro
    display_name: gemini-2.5-pro       # matches model_name — no display lie
    region: us-central1                # 2.5-pro not served in asia-south1; see header
    pricing: { input: 1.25, input_cached: 0.3125, output: 10.00 }
    # No `auth:` — Vertex authenticates through ADC, so naming an API-key
    # variable here declares a credential the adapter never reads.
    #
    # This block WAS kept as vestigial-but-harmless, on the argument that
    # deleting it would disturb diffs against the frozen snapshots of past Pro
    # runs. Dropped 2026-07-29 for two reasons. The argument doesn't hold: a
    # `policy_snapshot.json` is a frozen COPY inside its run directory, so it
    # neither re-reads this file nor changes when this file does. And the
    # 2026-07-29 doorway correction (see flash-3-5-high.yaml) removed the same
    # block from eight sibling templates, which would have left two different
    # conventions for one situation — the exact structural drift the `api:`
    # axis was added to end.

rules:
  # Premium-judgment phases — stay on Opus
  - when: { phase: requirements_analysis }
    use: opus
    reason: "Judgment-heavy, low volume — premium"
  - when: { phase: architecture_design }
    use: opus
    reason: "Foundational, decision-bearing — premium"
  - when: { phase: plan_task_packets }
    use: opus
    reason: "Needs full context to slice work cleanly — premium"
  - when: { phase: senior_code_review }
    use: opus
    reason: "Cross-file reasoning + judgment — premium"
  - when: { phase: security_review }
    use: opus
    reason: "Risk-bearing, low volume — premium"

  # High-volume mechanical phases — Gemini Pro (still capable, much cheaper than Opus)
  - when:
      phase: codegen
      task_type:
        - controller_handler
        - service_method
        - dto
        - module_wiring
        - migration
        - seed_data
        - entity
        - guard
        - interceptor
        - filter
        - react_component
        - react_page
        - api_client
        - frontend_util
        - frontend_config
        - frontend_html
    use: gemini-pro
    reason: "Schema-driven boilerplate — Pro handles cross-file dependencies well at lower cost than Opus"
  - when: { phase: tests }
    use: gemini-pro
    reason: "Scaffold-heavy, pattern-based — cost-efficient tier"
  - when: { phase: docs }
    use: gemini-pro
    reason: "Volume work — cost-efficient tier"

  # Debug with escalation: try cost-efficient first, escalate to Opus after 2 retries
  - when: { phase: debug, retry_count: { gte: 2 } }
    use: opus
    reason: "Escalation: 2 cost-efficient tier attempts failed"
  - when: { phase: debug }
    use: gemini-pro
    reason: "Most debugs have clear cause — cost-efficient tier"

  - default: opus
    reason: "Unrecognized task — fail safe to premium"
