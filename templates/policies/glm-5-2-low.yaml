# Workforce Ops v1.1 POC — MID-tier sweep companion to glm-5-2-thinking.yaml.
# Single-model build with GLM-5.2 at reasoning_effort=low (one tier down
# from max), thinking still enabled. Runs head-to-head against
# flash-3-5-low.yaml on the same v1.1 idempotency enhancement, seeded from
# Pass 1.
#
# Tier-pairing note: GLM's "low" reasoning_effort and Gemini's "low"
# thinkingLevel are vendor-labeled the same but not necessarily equivalent
# in actual compute. Disclosed in the study ledger.
#
# Pricing-as-of: 2026-06-30 (Z.ai first-party).
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: glm-5-2-low

models:
  - id: glm-5-2
    adapter: builtin-openai-compat
    api: openai-compat
    model_name: glm-5.2
    display_name: glm-5.2 (thinking, low)
    endpoint: https://api.z.ai/api/paas/v4/
    reasoning:
      enabled: true
      effort: low
    pricing:
      input: 1.40
      input_cached: 0.26
      output: 4.40
    pricing_source: https://docs.z.ai/guides/overview/pricing
    auth:
      env: ZAI_API_KEY

rules:
  - default: glm-5-2
    reason: "v1.1 POC MID — GLM-5.2, thinking enabled, reasoning_effort=low, every phase"
