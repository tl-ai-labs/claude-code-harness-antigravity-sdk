# Workforce Ops v1.1 POC — MIN-tier (no-thinking) companion to
# glm-5-2-thinking.yaml + glm-5-2-low.yaml. Runs head-to-head against
# flash-3-5-minimal.yaml on the same v1.1 idempotency enhancement.
#
# Thinking is fully disabled:
#   - thinking.type: "disabled" (Z.ai docs canonical off-switch)
#   - reasoning_effort: "off" (matched lowest-effort setting)
# This is the first MIN-tier pair where BOTH models have thinking
# verifiably at zero — making this the most apples-to-apples comparison
# in the tier sweep (MAX and MID were vendor-label-paired, not effort-paired).
#
# Pricing-as-of: 2026-06-30 (Z.ai first-party).
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: glm-5-2-thinking-off

models:
  - id: glm-5-2
    adapter: builtin-openai-compat
    api: openai-compat
    model_name: glm-5.2
    display_name: glm-5.2 (no thinking)
    endpoint: https://api.z.ai/api/paas/v4/
    reasoning:
      enabled: false
      effort: off
    pricing:
      input: 1.40
      input_cached: 0.26
      output: 4.40
    pricing_source: https://docs.z.ai/guides/overview/pricing
    auth:
      env: ZAI_API_KEY

rules:
  - default: glm-5-2
    reason: "v1.1 POC MIN — GLM-5.2, thinking disabled, reasoning_effort=off"
