# Workforce Ops · Pass 5 — single-model build with Gemini Flash for every
# phase. The most aggressive cost-tier-down data point: how cheap does the
# same software get when there's no premium tier at all? Quality risk is
# real on the judgment-heavy phases (architecture, security review); the
# pass is run to *measure* that risk against the orchestrated baselines.
#
# 2026-07-20: switched gemini-3.5-flash → gemini-2.5-flash (Teja's Pathfinder
# ask: run briefs on the 2.5 catalogue with full request-payload logging).
# Pricing block updated in the same change — the old block carried the
# 3.5-flash rates (1.50/0.15/9.00), which would overstate 2.5-flash costs ~5x.
# 2.5-flash serves in our pinned asia-south1 region. (That region is now stated
# explicitly below rather than left implicit — schema v2 requires it whenever a
# model declares `api: vertex`, precisely so the doorway can't drift.)
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: gemini-flash-only

models:
  - id: gemini-flash
    adapter: mcp
    # Vertex, NOT AI Studio — corrected 2026-07-29. The v2 migration wrote
    # `api: ai-studio` + an API-key auth block here; every Gemini call in this
    # corpus (413) ran on Vertex ADC or the Antigravity seat, none on an AI
    # Studio key. `api` outranks the environment in GeminiAdapter, so the wrong
    # value silently reroutes the run onto another wallet and quota pool rather
    # than failing. Full rationale in flash-3-5-high.yaml.
    api: vertex
    region: asia-south1               # loader REQUIRES a region for api: vertex
    model_name: gemini-2.5-flash
    display_name: gemini-2.5-flash
    # input_cached corrected 2026-07-26 (was 0.075): Google prices Gemini
    # cache reads at input x 0.1, not x 0.25. Table fixed 2026-07-23; these
    # inline blocks were the follow-up that was missed.
    #
    # These are list rates AND what a regional call actually bills: Vertex's
    # non-global surcharge is scoped to Gemini 3 and later families, so 2.5 in
    # asia-south1 owes list. The exporter's restatement reaches the same
    # conclusion from the gateway string, and labels the basis "list".
    pricing: { input: 0.30, input_cached: 0.03, output: 2.50 }
    pricing_source: https://ai.google.dev/gemini-api/docs/pricing
    # No `auth:` — Vertex uses Application Default Credentials (gcloud login).

rules:
  - default: gemini-flash
    reason: "Pass 5 — single-model, cost-efficient tier across every phase"
