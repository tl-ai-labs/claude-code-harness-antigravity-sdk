# Workforce Ops v1.1 POC — MIN-tier (no-thinking) companion to
# flash-3-5-high.yaml + flash-3-5-low.yaml. Runs head-to-head against
# glm-5-2-thinking-off.yaml on the same v1.1 idempotency enhancement.
#
# IMPORTANT — undocumented-but-verified config:
# `thinkingLevel: minimal` is NOT listed in the public Gemini 3.5 Flash
# thinking docs (which only document low/medium/high). It is, however,
# - accepted by the live generateContent API on gemini-3.5-flash
# - the same value AA uses to test the "Gemini 3.5 Flash (minimal)" row
# - returns zero thoughtsTokenCount (i.e. fully no-thinking)
# Verified via direct cURL probe on 2026-07-01:
#   thinkingConfig: { thinkingLevel: "minimal" } → 200 OK,
#   usageMetadata.thoughtsTokenCount=None (no reasoning tokens spent).
# Legacy `thinkingBudget: 0` ALSO works as an alternative.
# If a future SDK or API change breaks "minimal", swap to thinkingBudget: 0.
#
# Pricing-as-of: 2026-06-30 (Google first-party).
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: flash-3-5-minimal

models:
  - id: flash-3-5
    adapter: mcp
    # Vertex, NOT AI Studio — corrected 2026-07-29. The v2 migration wrote
    # `api: ai-studio` + an API-key auth block here; no Gemini call in this
    # corpus has ever used AI Studio. `api` outranks the environment in
    # GeminiAdapter, so the wrong value reroutes the run silently onto another
    # wallet and quota pool instead of failing. Full rationale in the sibling
    # flash-3-5-high.yaml, which carries the tier-sweep's canonical block.
    #
    # Doorway note specific to THIS file: the `thinkingLevel: minimal` probe
    # documented above was run against the first-party generateContent endpoint
    # on 2026-07-01. Vertex serves the same model and accepts the same
    # thinkingConfig, but if a future run ever 400s on the tier, re-probe on
    # Vertex before assuming the value itself broke.
    api: vertex
    region: asia-south1               # loader REQUIRES a region for api: vertex
    model_name: gemini-3.5-flash
    display_name: gemini-3.5-flash (no thinking)
    reasoning:
      tier: minimal
    # Vendor LIST price; the Vertex regional surcharge is applied downstream by
    # the exporter's restatement, not baked in here.
    pricing:
      input: 1.50
      input_cached: 0.15
      output: 9.00
    pricing_source: https://ai.google.dev/gemini-api/docs/pricing
    # No `auth:` — Vertex uses Application Default Credentials (gcloud login).

rules:
  - default: flash-3-5
    reason: "v1.1 POC MIN — Gemini 3.5 Flash, thinkingLevel=minimal (no thinking)"
