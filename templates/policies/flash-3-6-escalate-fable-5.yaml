# Flash-3.6 / Fable-5 study — Run 2 of 4: Gemini 3.6 Flash on every phase, with
# a debug ESCALATION to Fable 5 after two failed repair attempts. Same economic
# baseline as Run 1, plus a frontier safety net that only engages when Flash has
# demonstrably failed to fix a build/test failure twice — the "cheap-first, pay
# for the frontier only when you must" data point.
#
# WHEN THE ESCALATION FIRES: sdlc-mini's verify stage (v0.8.0) runs a real
#   build-and-test with a debug/repair loop (max_rounds 3). Each failed round
#   re-dispatches a `debug` packet with an incremented retry_count. The rule
#   below routes retry_count >= 2 (the 3rd attempt, after 2 Flash failures) to
#   Fable 5. So — unlike the orchestrator's happy-path headless driver — this
#   escalation is genuinely fireable here whenever verify actually fails twice.
#
# ADAPTERS & PRICING: see flash-3-6-only.yaml (flash-36 → antigravity-sdk on
#   api: vertex, region global) and fable-5-only.yaml (fable-5 → builtin-anthropic,
#   claude-fable-5). BOTH prices confirmed 2026-07-22 against the public launch
#   rates — Flash 3.6 (1.50 / 0.15 / 7.50) and Fable 5 (10.00 / 1.00 / 50.00).
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: flash-3-6-escalate-fable-5

models:
  - id: flash-36
    adapter: antigravity-sdk
    api: vertex
    model_name: gemini-3.6-flash
    display_name: gemini-3.6-flash
    region: global
    pricing: { input: 1.50, input_cached: 0.15, output: 7.50 } # confirmed 2026-07-22 (Gemini 3.6 Flash launch rate)
    pricing_source: https://cloud.google.com/vertex-ai/generative-ai/pricing
  - id: fable-5
    adapter: builtin-anthropic
    api: anthropic
    model_name: claude-fable-5
    display_name: claude-fable-5
    pricing: { input: 10.00, input_cached: 1.00, output: 50.00 } # confirmed 2026-07-22 (platform.claude.com/pricing)
    pricing_source: https://platform.claude.com/docs/en/about-claude/pricing
    auth: { env: ANTHROPIC_API_KEY }

rules:
  # Escalation: two Flash debug attempts already failed — hand the repair up to
  # the frontier. Must precede the general debug rule (first match wins).
  - when: { phase: debug, retry_count: { gte: 2 } }
    use: fable-5
    reason: "Escalation: 2 Flash 3.6 repair attempts failed — send the debug to the frontier (Fable 5)"

  # Everything else — every judgment and mechanical phase, and the first two
  # debug attempts — stays on Flash 3.6.
  - default: flash-36
    reason: "Flash 3.6 owns every phase; Fable 5 is the escalation-only safety net"
