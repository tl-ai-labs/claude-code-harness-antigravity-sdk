# Workforce Ops v1.1 POC — single-model build with Gemini 3.5 Flash at
# maximum thinking level. Runs head-to-head against glm-5-2-thinking.yaml on
# the same v1.1 idempotency enhancement, seeded from Pass 1.
#
# Routes via the `mcp` adapter on the Vertex doorway (uses @google/genai v2+
# for thinking_level support). Renamed 2026-07-28: this was spelled
# `gemini-thinking`, one of four historic aliases that all meant the same
# adapter; the loader still accepts the old spelling so frozen snapshots replay.
#
# Pricing-as-of: 2026-06-30 (Google first-party).
# Schema v2 (2026-07-28): every model declares the API doorway it is reached
# through, alongside the adapter that reaches it. `adapter` alone was ambiguous
# — `mcp` gets to Gemini on both AI Studio and Vertex, which meter, quota and
# price separately, and until now which one ran was decided by the machine's
# environment rather than by this file. See packages/policy/src/types.ts.
version: 2
name: flash-3-5-high

models:
  - id: flash-3-5
    adapter: mcp
    # ── Vertex, NOT AI Studio. Corrected 2026-07-29. ────────────────────────
    # The v2 migration wrote `api: ai-studio` + an API-key auth block into this
    # file and its siblings. That was an authoring error, and a silent one:
    # every Gemini call in the corpus (413 of them) went through Vertex ADC or
    # the Antigravity enterprise seat, and NONE through an AI Studio key — so
    # the declaration contradicted the only doorway this study has ever used,
    # including its own three prior runs, which each recorded
    # `gemini-3.5-flash / vertex-adc / asia-south1` eight times over.
    #
    # It is silent because `api` OUTRANKS the environment: GeminiAdapter
    # (packages/adapters/src/gemini.ts) resolves
    #   declared ?? forced ?? (creds ? "vertex" : key ? "api-key" : "vertex")
    # so a machine with working ADC still gets pushed onto the API key when the
    # policy says ai-studio. Nothing errors. The run just lands on a different
    # wallet and a different quota pool, loses its region, and records
    # `gateway: gemini-api-key` — which makes its cost column incomparable with
    # the runs sitting beside it on the same card. That is the whole reason
    # schema v2 moved this decision out of the environment and into the file:
    # the file has to name the doorway that actually runs.
    api: vertex
    region: asia-south1               # loader REQUIRES a region for api: vertex
    model_name: gemini-3.5-flash
    display_name: gemini-3.5-flash (high)
    reasoning:
      tier: high
    # Vendor LIST price, deliberately. Vertex's non-global surcharge (Gemini 3
    # and later families only) is applied downstream by the exporter's
    # restatement from stored tokens — see apps/api/src/recost.ts — not baked
    # in here. So this block and its source URL stay the list card even though
    # the call is served regionally.
    pricing:
      input: 1.50
      input_cached: 0.15
      output: 9.00
    pricing_source: https://ai.google.dev/gemini-api/docs/pricing
    # No `auth:` block — Vertex authenticates with Application Default
    # Credentials (the operator's own gcloud login on project
    # ai-studies-console). An `auth.env` here would be the AI Studio shape.

rules:
  - default: flash-3-5
    reason: "v1.1 POC — Gemini 3.5 Flash, thinking_level=high, every phase"
